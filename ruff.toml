# Lint config for CI. Default rules (pyflakes + pycodestyle errors) only.
line-length = 120
extend-exclude = ["notebooks"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702"]   # short plotting one-liners in train.py
# matplotlib.use("Agg") has to run before pyplot is imported
per-file-ignores = { "src/evaluation/confusion.py" = ["E402"] }
