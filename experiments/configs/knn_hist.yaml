# KNN on HSV colour histograms. Merged on top of default.yaml.
run_name: knn_hist

features:
  name: colour_histogram
  load_size: [64, 64]
  bins: 32              # 3 channels x 32 bins = 96 dims

model:
  name: knn
  params:
    k_grid: [1, 3, 5, 7, 11, 15, 21, 31]
    weights: [uniform, distance]
    metric: euclidean
    pca: null
