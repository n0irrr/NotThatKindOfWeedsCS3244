# KNN on HOG features. Kaggle split, fold 0. Merged on top of default.yaml.
run_name: knn_hog_kaggle0

data:
  splits_dir: data/splits_kaggle0   # Kaggle zip, labels/*_subset0.csv (src/data/kaggle_split.py)

features:
  name: hog
  load_size: [64, 64]
  size: [64, 64]        # 9 orientations, 8x8-pixel cells, 2x2-cell blocks -> 1764 dims

model:
  name: knn
  params:
    k_grid: [1, 3, 5, 7, 11, 15, 21, 31]
    weights: [uniform, distance]
    metric: euclidean
    pca: 100            # same as knn_pixels: distances in ~2k dims are uninformative
