# simple_cnn.yaml + geometric augmentation (flips and 90-degree rotations).
# Only change vs simple_cnn.yaml. Merged on top of default.yaml.
run_name: simple_cnn_aug_geo

data:
  image_size: [128, 128]

model:
  name: simple_cnn
  params:
    channels: [32, 64, 128, 256]
    dropout: 0.3
    weight_decay: 1.0e-4

training:
  epochs: 30
  batch_size: 64
  learning_rate: 1.0e-3
  patience: 30              # no early stopping: val F1 is noisy until the cosine LR decays
  augmentation: [flip, rotate]
