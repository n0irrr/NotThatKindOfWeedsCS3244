# Logistic regression on raw pixels. Kaggle split, fold 0. Merged on top of default.yaml.
run_name: logreg_pixels_kaggle0

data:
  splits_dir: data/splits_kaggle0   # Kaggle zip, labels/*_subset0.csv (src/data/kaggle_split.py)

features:
  name: flattened_pixels
  load_size: [64, 64]
  size: [32, 32]        # 3072 dims, same as knn_pixels

model:
  name: logreg
  params:
    C_grid: [0.001, 0.01, 0.1, 1, 10, 100, 1000]
    pca: null
    max_iter: 2000
