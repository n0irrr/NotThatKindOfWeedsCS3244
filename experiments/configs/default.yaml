# Shared defaults — override per experiment with a new YAML in this folder.
seed: 42

data:
  labels_csv: data/labels.csv
  images_dir: data/images
  splits_dir: data/splits_kaggle0   # the authors' split from the Kaggle zip, fold 0 (src/data/kaggle_split.py)
  image_size: [224, 224]
  normalise: train         # train (stats from train split only) | imagenet (pretrained backbones)

# Class names as in the DeepWeeds labels.csv (Species column)
classes:
  - Chinee apple
  - Lantana
  - Parkinsonia
  - Parthenium
  - Prickly acacia
  - Rubber vine
  - Siam weed
  - Snake weed
  - Negative

model:
  name: knn            # knn | simple_cnn | resnet50
  params: {}

training:
  epochs: 20
  batch_size: 32
  learning_rate: 1.0e-3
  # Train split only. Any of: flip, rotate, crop, translate, colour, blur, noise
  # (see src/features/augment.py). Empty = reference run.
  augmentation: []
  num_workers: 4           # CNN data loading: decode + augment in parallel (0 = main process)

evaluation:
  metrics: [accuracy, macro_precision, macro_recall, macro_f1]
  per_class: true
  confusion_matrix: true
